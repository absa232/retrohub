<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Game</title>
  <style>
    :root {
      --bg-color: #0f0e17;
      --card-bg: #1f1e2e;
      --accent: #ff8ba7;
      --text: #fffffe;
      --subtext: #a7a9be;
      --panel: rgba(31, 30, 46, 0.92);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #2a0845 0%, #0f0e17 55%, #1f1e2e 100%);
      color: var(--text);
      overflow: hidden;
    }
    
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    #game {
      flex: 1;
      background: #000;
      position: relative;
      outline: none;
    }

    #game canvas {
      outline: none;
    }
    
    .top-bar {
      background: rgba(15, 14, 23, 0.96);
      color: var(--text);
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
    
    .game-title {
      flex: 1;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--accent);
    }
    
    .close-btn {
      background: var(--accent);
      color: #111;
      border: none;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(255, 139, 167, 0.3);
    }
    
    .close-btn:hover {
      filter: brightness(1.06);
    }

    .ejs_virtualGamepad_parent,
    .ejs_virtualGamepad_top,
    .ejs_virtualGamepad_bottom,
    .ejs_virtualGamepad_left,
    .ejs_virtualGamepad_right,
    .ejs_virtualGamepad_button,
    .ejs_dpad_main,
    .ejs_dpad_vertical,
    .ejs_dpad_horizontal,
    .ejs_dpad_bar,
    [class*="virtualGamepad"],
    [class*="dpad"] {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
    
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      text-align: center;
      z-index: 10;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .error-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(231, 76, 60, 0.9);
      color: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      z-index: 20;
      max-width: 80%;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="top-bar">
      <div class="game-title" id="game-title">Loading...</div>
      <button class="close-btn" onclick="closeGame()">Save & Exit Game</button>
    </div>
    <div id="game" tabindex="0"></div>
    <div class="loading" id="loading-indicator">
      <div class="loading-spinner"></div>
      <div>Loading game...</div>
    </div>
    <div class="error-msg" id="error-msg" style="display: none;"></div>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAeS_FJxXZbbakYuOMhF1MI_1P1Ht8EUwA",
      authDomain: "our-arcade-c417d.firebaseapp.com",
      projectId: "our-arcade-c417d",
      storageBucket: "our-arcade-c417d.firebasestorage.app",
      messagingSenderId: "48063295144",
      appId: "1:48063295144:web:1bdcb75b600222d8ee5c9d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    window.firestoreDoc = doc;
    window.firestoreGetDoc = getDoc;

    window.firebaseApp = app;
    window.firebaseAuth = auth;
    window.firebaseDb = db;
    window.currentUser = null;

    let playerAuthRedirectTimer = null;
    let authStateResolved = false;
    let resolveAuthState;
    const authStateReady = new Promise((resolve) => {
      resolveAuthState = resolve;
    });
    window.authStateReady = authStateReady;

    onAuthStateChanged(auth, (user) => {
      authStateResolved = true;
      window.currentUser = user;
      resolveAuthState(user);

      if (user) {
        if (playerAuthRedirectTimer) {
          clearTimeout(playerAuthRedirectTimer);
          playerAuthRedirectTimer = null;
        }
        console.log('Player page: User logged in as', user.uid);
        return;
      }

      if (!authStateResolved || auth.currentUser) {
        return;
      }

      if (playerAuthRedirectTimer) {
        clearTimeout(playerAuthRedirectTimer);
      }

      playerAuthRedirectTimer = setTimeout(() => {
        if (authStateResolved && !auth.currentUser) {
          console.log('Player page: No user logged in after auth settled, returning to dashboard');
          window.location.replace('dashboard.html');
        }
      }, 500);
    });

    function bytesToBase64(value) {
      let bytes;

      if (value instanceof ArrayBuffer) {
        bytes = new Uint8Array(value);
      } else if (ArrayBuffer.isView(value)) {
        bytes = new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
      } else if (value && typeof value.length === 'number') {
        bytes = Uint8Array.from(value);
      } else {
        return null;
      }

      let binary = '';
      const chunkSize = 0x8000;
      for (let index = 0; index < bytes.length; index += chunkSize) {
        binary += String.fromCharCode(...bytes.subarray(index, index + chunkSize));
      }
      return btoa(binary);
    }

    async function serializeSaveState(value) {
      const binaryValue = bytesToBase64(value);
      if (binaryValue !== null) return binaryValue;
      if (value instanceof Blob) return bytesToBase64(await value.arrayBuffer());
      return value;
    }

    function base64ToBlobUrl(value) {
      return URL.createObjectURL(new Blob([base64ToBytes(value)], { type: 'application/octet-stream' }));
    }

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index++) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    const SAVE_CHUNK_SIZE = 700000;
    let pendingSavePromise = Promise.resolve();

    function openLocalSaveDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('RetroHubLocalSaves', 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);
        request.onupgradeneeded = () => {
          request.result.createObjectStore('states', { keyPath: 'gameTitle' });
        };
      });
    }

    async function saveStateLocally(gameTitle, state) {
      const database = await openLocalSaveDb();
      await new Promise((resolve, reject) => {
        const transaction = database.transaction('states', 'readwrite');
        transaction.objectStore('states').put({
          gameTitle,
          state,
          timestamp: new Date().toISOString()
        });
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
      });
      database.close();
    }

    async function loadStateLocally(gameTitle) {
      const database = await openLocalSaveDb();
      const result = await new Promise((resolve, reject) => {
        const request = database.transaction('states', 'readonly')
          .objectStore('states')
          .get(gameTitle);
        request.onsuccess = () => resolve(request.result?.state || null);
        request.onerror = () => reject(request.error);
      });
      database.close();
      return result;
    }

    window.saveStateLocally = saveStateLocally;
    window.loadStateLocally = loadStateLocally;
    window.base64ToBytes = base64ToBytes;

    // Save handler
    window.syncSaveToCloud = async (gameState) => {
      if (!window.currentUser || !window.currentGameTitle) return;
      
      try {
        let serializedState = await serializeSaveState(gameState);
        if (typeof serializedState !== 'string') {
          serializedState = JSON.stringify(serializedState);
        }

        await saveStateLocally(window.currentGameTitle, serializedState);

        const saveRef = doc(db, 'saves', window.currentUser.uid, 'games', window.currentGameTitle);
        const chunks = [];
        for (let index = 0; index < serializedState.length; index += SAVE_CHUNK_SIZE) {
          chunks.push(serializedState.slice(index, index + SAVE_CHUNK_SIZE));
        }

        await setDoc(saveRef, {
          state: null,
          stateFormat: 'chunked-text-v1',
          chunkCount: chunks.length,
          totalLength: serializedState.length,
          timestamp: new Date().toISOString()
        }, { merge: true });

        await Promise.all(chunks.map((chunk, index) => {
          const chunkRef = doc(saveRef, 'chunks', String(index));
          return setDoc(chunkRef, { index, data: chunk });
        }));
      } catch (err) {
        console.warn('Save to cloud failed:', err?.message || err);
      }
    };

    window.saveCurrentGameState = async () => {
      const emulator = window.EJS_emulator;
      const getState = emulator?.gameManager?.getState;
      if (!getState || !window.currentUser || !window.currentGameTitle) return false;

      try {
        const state = getState.call(emulator.gameManager);
        if (state == null) return false;
        pendingSavePromise = window.syncSaveToCloud(state);
        await pendingSavePromise;
        return true;
      } catch (err) {
        console.warn('Final save failed:', err?.message || err);
        return false;
      }
    };

    window.saveCurrentGameStateLocally = async () => {
      const emulator = window.EJS_emulator;
      const getState = emulator?.gameManager?.getState;
      if (!getState || !window.currentGameTitle) return null;

      try {
        const state = getState.call(emulator.gameManager);
        if (state == null) return null;
        let serializedState = await serializeSaveState(state);
        if (typeof serializedState !== 'string') {
          serializedState = JSON.stringify(serializedState);
        }
        await saveStateLocally(window.currentGameTitle, serializedState);
        return state;
      } catch (err) {
        console.warn('Local save failed:', err?.message || err);
        return null;
      }
    };

    window.suppressKnownEjsWarnings = () => {
      const oldWarn = console.warn;
      const patterns = [/Failed to execute 'getImageData'/i, /OffscreenCanvas/i];
      console.warn = function(...args) {
        const text = args[0]?.toString?.() || '';
        if (!patterns.some(p => p.test(text))) {
          oldWarn.apply(console, args);
        }
      };
    };
  </script>

  <script>
    // Get game parameters from URL
    const params = new URLSearchParams(window.location.search);
    const gameCore = params.get('core');
    const gameRomUrl = params.get('romUrl');
    const gameTitle = params.get('title');

    window.currentGameTitle = gameTitle;
    window.currentGameCore = gameCore;
    window.currentGameRomUrl = gameRomUrl;

    // Update title
    document.getElementById('game-title').textContent = gameTitle || 'Game';

    function focusGameCanvas() {
      const gameContainer = document.getElementById('game');
      if (!gameContainer) return;
      gameContainer.focus();
      const canvas = gameContainer.querySelector('canvas') || gameContainer.querySelector('iframe');
      if (canvas) {
        canvas.focus();
      }
    }

    // Clears any stale/empty control entries from localStorage
    function sanitizeControlCache() {
      try {
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && (key.includes('EJS') || key.includes('controls') || key.includes('settings'))) {
            keysToRemove.push(key);
          }
        }
        keysToRemove.forEach(k => localStorage.removeItem(k));
      } catch (e) {
        console.warn('Control cache reset warning:', e);
      }
    }

    async function resolvePlayableRomUrl(romPath) {
      if (romPath && romPath.startsWith('https://archive.org')) {
        const proxyBaseUrl = 'https://patient-cloud-c9bc.retrohub-proxy.workers.dev';
        return `${proxyBaseUrl}/?url=${encodeURIComponent(romPath)}`;
      }
      return romPath;
    }

    async function bootEmulator() {
      if (!gameCore || !gameRomUrl) {
        showError('Missing game parameters (core or romUrl)');
        return;
      }

      try {
        await window.authStateReady;

        // Clear stale local control cache
        sanitizeControlCache();

        // Prepare game container
        const gameDiv = document.getElementById('game');
        gameDiv.innerHTML = '';

        // Resolve ROM URL (handle Archive.org via proxy)
        const playableUrl = await resolvePlayableRomUrl(gameRomUrl);

        // Set up EmulatorJS globals
        window.EJS_player = '#game';
        window.EJS_gameUrl = playableUrl;
        window.EJS_core = gameCore;
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_gameid = gameTitle;
        window.EJS_gameID = gameTitle;
        window.EJS_startOnLoaded = true;
        window.EJS_hideMenubar = false;

        // RetroArch Index Mapping with object value structures:
        // 0: B, 1: Y, 2: SELECT, 3: START, 4: UP, 5: DOWN, 6: LEFT, 7: RIGHT, 8: A, 9: X, 10: L, 11: R
        window.EJS_defaultControls = {
          0: { value: 'KeyX', value2: '' },       // B: Mega Drive B -> Keyboard X
          1: { value: 'KeyS', value2: '' },       // Y: Mega Drive Y -> Keyboard S
          2: { value: 'ShiftLeft', value2: '' },  // SELECT: Mode -> Keyboard Shift
          3: { value: 'Enter', value2: '' },      // START: Start -> Keyboard Enter
          4: { value: 'ArrowUp', value2: '' },    // UP: D-Pad Up -> Up Arrow
          5: { value: 'ArrowDown', value2: '' },  // DOWN: D-Pad Down -> Down Arrow
          6: { value: 'ArrowLeft', value2: '' },  // LEFT: D-Pad Left -> Left Arrow
          7: { value: 'ArrowRight', value2: '' }, // RIGHT: D-Pad Right -> Right Arrow
          8: { value: 'KeyZ', value2: '' },       // A: Mega Drive A -> Keyboard Z
          9: { value: 'KeyA', value2: '' },       // X: Mega Drive X -> Keyboard A
          10: { value: 'KeyC', value2: '' },      // L: Mega Drive C -> Keyboard C
          11: { value: 'KeyD', value2: '' }       // R: Mega Drive Z -> Keyboard D
        };

        if (gameCore === 'fbneo' || gameCore === 'fba') {
          const proxyBaseUrl = 'https://patient-cloud-c9bc.retrohub-proxy.workers.dev';
          const biosUrl = 'https://archive.org/download/neo-geo-bios/neogeo.zip';
          window.EJS_biosUrl = `${proxyBaseUrl}/?url=${encodeURIComponent(biosUrl)}`;
        }

        // Save handler
        window.EJS_onSaveState = (data) => {
          const payload = data && typeof data === 'object' && data.state !== undefined ? data.state : data;
          pendingSavePromise = window.syncSaveToCloud(payload);
          return pendingSavePromise;
        };

        window.EJS_onLoadState = () => {
          console.log('Loaded saved game state into emulator');
        };

        window.EJS_onGameStart = () => {
          focusGameCanvas();

          let attempts = 0;
          const focusInterval = setInterval(() => {
            focusGameCanvas();
            attempts++;
            if (attempts > 10) clearInterval(focusInterval);
          }, 300);

          if (window.__pendingSavedStateBytes && window.EJS_emulator?.gameManager) {
            window.EJS_emulator.gameManager.loadState(window.__pendingSavedStateBytes);
            window.__pendingSavedStateBytes = null;
            console.log('Applied saved game state to emulator');
          }
        };

        // Load saved game state if it exists
        if (window.currentUser && window.currentGameTitle && window.firebaseDb) {
          try {
            let savedState = null;
            try {
              savedState = await window.loadStateLocally(window.currentGameTitle);
            } catch (localError) {
              console.warn('Local save lookup failed; checking Firestore:', localError?.message || localError);
            }
            let saveData = { stateFormat: 'chunked-text-v1' };

            if (savedState) {
              console.log('Loaded saved game state from local storage');
            } else {
              console.log('No local save found; checking Firestore');
              let saveRef = window.firestoreDoc(window.firebaseDb, 'saves', window.currentUser.uid, 'games', window.currentGameTitle);
              let saveSnap = await window.firestoreGetDoc(saveRef);

              if (!saveSnap.exists()) {
                saveRef = window.firestoreDoc(window.firebaseDoc(window.firebaseDb, 'users', window.currentUser.uid, 'saves', window.currentGameTitle));
                saveSnap = await window.firestoreGetDoc(saveRef);
              }

              if (saveSnap.exists()) {
                saveData = saveSnap.data();
                savedState = saveData.state;

                if (saveData.stateFormat === 'chunked-text-v1' && saveData.chunkCount) {
                  savedState = '';
                  for (let index = 0; index < saveData.chunkCount; index++) {
                    const chunkSnap = await window.firestoreGetDoc(window.firestoreDoc(saveRef, 'chunks', String(index)));
                    if (!chunkSnap.exists()) throw new Error(`Missing save chunk ${index}`);
                    savedState += chunkSnap.data().data || '';
                  }
                }

                if (savedState) {
                  await window.saveStateLocally(window.currentGameTitle, savedState);
                  console.log('Loaded saved game state from Firestore and cached locally');
                } else {
                  console.log('No saved game state found in Firestore');
                }
              }
            }

            if (savedState) {
              if (saveData.stateFormat === 'chunked-text-v1' || typeof savedState === 'string') {
                window.__pendingSavedStateBytes = window.base64ToBytes(savedState);
                console.log('Prepared Firestore save bytes for emulator');
              } else {
                window.EJS_loadStateURL = savedState;
              }
            } else {
              console.log('Firestore document exists but contains no state data');
            }
          } catch (err) {
            console.warn('Save load failed:', err?.message || err);
          }
        }

        // Load EmulatorJS loader
        const script = document.createElement('script');
        script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
        script.async = false;
        
        script.onload = () => {
          console.log('EmulatorJS loader loaded');
          setTimeout(() => {
            const loading = document.getElementById('loading-indicator');
            if (loading) loading.style.display = 'none';
            focusGameCanvas();
          }, 2000);

          setupAutosave();
          suppressKnownEjsWarnings();
        };

        script.onerror = () => {
          showError('Failed to load EmulatorJS. Check your internet connection.');
        };

        document.body.appendChild(script);

      } catch (err) {
        showError('Error booting emulator: ' + (err?.message || err));
      }
    }

    function setupAutosave() {
      if (window.currentAutoSaveInterval) clearInterval(window.currentAutoSaveInterval);
      
      window.currentAutoSaveInterval = setInterval(async () => {
        if (!window.EJS_emulator || !window.currentUser) return;
        
        try {
          const state = window.EJS_emulator.gameManager?.getState?.();
          if (state != null) {
            pendingSavePromise = window.syncSaveToCloud(state);
            await pendingSavePromise;
            console.log('Auto-saved game state');
          }
        } catch (err) {
          console.warn('Auto-save failed:', err?.message || err);
        }
      }, 120000);
    }

    function showError(msg) {
      const errorDiv = document.getElementById('error-msg');
      errorDiv.textContent = msg;
      errorDiv.style.display = 'block';
      document.getElementById('loading-indicator').style.display = 'none';
    }

    async function closeGame() {
      const closeButton = document.querySelector('.close-btn');
      if (closeButton) {
        closeButton.disabled = true;
        closeButton.textContent = 'Saving...';
      }

      if (window.currentAutoSaveInterval) {
        clearInterval(window.currentAutoSaveInterval);
      }

      const state = await window.saveCurrentGameStateLocally();
      if (state != null && window.currentUser) {
        pendingSavePromise = window.syncSaveToCloud(state);
      }

      if (window.EJS_emulator && typeof window.EJS_emulator.destroy === 'function') {
        try {
          window.EJS_emulator.destroy();
        } catch (e) {
          console.warn('Emulator destroy failed:', e);
        }
      }

      window.location.assign('dashboard.html');
    }

    window.closeGame = closeGame;

    // Focus emulator canvas on click
    document.getElementById('game').addEventListener('click', focusGameCanvas);

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootEmulator);
    } else {
      bootEmulator();
    }
  </script>
</body>
</html>
