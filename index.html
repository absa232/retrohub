<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Arcade 💕</title>
  
  <!-- GOOGLE NOTO COLOR EMOJI FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0f0e17;
      --card-bg: #1f1e2e;
      --accent: #ff8ba7;
      --text: #fffffe;
      --subtext: #a7a9be;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Noto Color Emoji';
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
    }

    /* --- ROMANTIC LANDING OVERLAY --- */
    #landing-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #2a0845 0%, #6441a5 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s;
      text-align: center;
      padding: 20px;
    }

    #landing-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .heart-icon {
      font-size: 60px;
      margin-bottom: 20px;
      font-family: 'Noto Color Emoji', sans-serif;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .landing-title {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .landing-subtitle {
      font-size: 1.1rem;
      color: #e0e0e0;
      margin-bottom: 30px;
      max-width: 400px;
    }

    .enter-btn {
      background-color: var(--accent);
      color: #000;
      border: none;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 139, 167, 0.4);
      transition: transform 0.2s, background-color 0.2s;
    }

    .enter-btn:hover {
      transform: scale(1.05);
      background-color: #ff9fb5;
    }

    /* --- DASHBOARD STYLES --- */
    .dashboard {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      margin-bottom: 40px;
      border-bottom: 2px solid var(--card-bg);
      padding-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-info h1 {
      font-size: 2.2rem;
      color: var(--accent);
    }

    .header-info p {
      color: var(--subtext);
      margin-top: 5px;
    }

    .user-profile {
      display: none;
      align-items: center;
      gap: 12px;
      background-color: var(--card-bg);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .user-profile.active {
      display: flex;
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      object-fit: cover;
    }

    .user-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
    }

    /* Categories & Games */
    .category-section {
      margin-bottom: 50px;
    }

    .category-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
    }

    .category-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 20px;
      background-color: var(--accent);
      border-radius: 2px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .game-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .game-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      border-color: var(--accent);
    }

    .game-thumb {
      width: 100%;
      height: 140px;
      background-color: #121212;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.5rem;
      font-family: 'Noto Color Emoji', sans-serif;
      overflow: hidden;
    }

    .game-card h3 {
      font-size: 1.1rem;
      margin-bottom: 5px;
    }

    .game-card p {
      font-size: 0.85rem;
      color: var(--subtext);
    }

    #loading-games-msg {
      text-align: center;
      color: var(--subtext);
      font-size: 1.2rem;
      padding: 40px 0;
    }

    /* --- EMULATOR MODAL --- */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal.active {
      visibility: visible;
      opacity: 1;
    }

    .modal-header {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 10px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .emulator-container {
      width: 100%;
      max-width: 800px;
      height: 600px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- ROMANTIC LANDING SCREEN -->
  <div id="landing-screen">
    <div class="heart-icon">🎮💖</div>
    <h1 class="landing-title">Welcome to Our Retro Hub</h1>
    <p class="landing-subtitle">I built this small space so we can play through some iconic classics together, no matter how many miles are between us.</p>
    <button class="enter-btn" onclick="loginAndEnter()">Sign in with Google 💖</button>
  </div>

  <!-- MAIN DASHBOARD -->
  <div class="dashboard">
    <header>
      <div class="header-info">
        <h1>Our Co-Op Corner</h1>
        <p id="user-greeting">Pick a game and let's play together!</p>
      </div>

      <div id="user-profile" class="user-profile">
        <img id="user-avatar" class="user-avatar" src="" alt="Profile Picture" />
        <span id="user-name" class="user-name"></span>
      </div>
    </header>

    <!-- DYNAMIC GAMES CONTAINER -->
    <div id="games-container">
      <div id="loading-games-msg">Scanning your arcade library... 🕹️</div>
    </div>
  </div>

  <!-- POPUP EMULATOR PLAYER -->
  <div id="player-modal" class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Loading Game...</h2>
      <button class="close-btn" onclick="closeGame()">✕ Close</button>
    </div>
    <div class="emulator-container">
      <div id="game"></div>
    </div>
  </div>

  <!-- CONFIGURATION -->
  <script>
    // UPDATE THESE TO YOUR GITHUB DETAILS
    const GITHUB_USERNAME = "absa232";
    const GITHUB_REPO = "retrohub";

    // System Emojis & Libretro Cover Art Map
    const SYSTEM_MAP = {
      'snes': { system: 'Nintendo_-_Super_Nintendo_Entertainment_System', name: 'Super Nintendo (SNES)', emoji: '🍄' },
      'gba': { system: 'Nintendo_-_Game_Boy_Advance', name: 'Game Boy Advance (GBA)', emoji: '⚡' },
      'n64': { system: 'Nintendo_-_Nintendo_64', name: 'Nintendo 64 (N64)', emoji: '⭐' },
      'nes': { system: 'Nintendo_-_Nintendo_Entertainment_System', name: 'Nintendo (NES)', emoji: '👾' },
      'gbc': { system: 'Nintendo_-_Game_Boy_Color', name: 'Game Boy Color (GBC)', emoji: '🎨' },
      'nds': { system: 'Nintendo_-_Nintendo_DS', name: 'Nintendo DS (NDS)', emoji: '📱' },
      'megadrive': { system: 'Sega_-_Mega_Drive_-_Genesis', name: 'Sega Genesis', emoji: '🦔' },
      'sega': { system: 'Sega_-_Mega_Drive_-_Genesis', name: 'Sega Genesis', emoji: '🦔' }
    };
  </script>

  <!-- FIREBASE SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAeS_FJxXZbbakYuOMhF1MI_1P1Ht8EUwA",
      authDomain: "our-arcade-c417d.firebaseapp.com",
      projectId: "our-arcade-c417d",
      storageBucket: "our-arcade-c417d.firebasestorage.app",
      messagingSenderId: "48063295144",
      appId: "1:48063295144:web:1bdcb75b600222d8ee5c9d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    provider.setCustomParameters({ prompt: 'select_account' });

    let currentUser = null;

    function updateUserUI(user) {
      if (!user) return;
      currentUser = user;
      document.getElementById('landing-screen').classList.add('hidden');
      document.getElementById('user-greeting').innerText = `Welcome back! Pick a game and let's play together!`;
      
      document.getElementById('user-name').innerText = user.displayName || 'Player';
      if (user.photoURL) {
        document.getElementById('user-avatar').src = user.photoURL;
      } else {
        document.getElementById('user-avatar').src = 'https://via.placeholder.com/40';
      }
      document.getElementById('user-profile').classList.add('active');
    }

    window.loginAndEnter = async function() {
      try {
        const result = await signInWithPopup(auth, provider);
        updateUserUI(result.user);
      } catch (error) {
        console.error("Authentication failed:", error);
      }
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        updateUserUI(user);
      }
    });

    const blobToBase64 = (blob) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(blob);
      });
    };

    const base64ToBlob = (base64) => {
      const byteCharacters = atob(base64);
      const byteNumbers = new Array(byteCharacters.length);
      for (let i = 0; i < byteCharacters.length; i++) {
        byteNumbers[i] = byteCharacters.charCodeAt(i);
      }
      return new Blob([new Uint8Array(byteNumbers)], { type: 'application/octet-stream' });
    };

    window.syncSaveToCloud = async function(saveBlob) {
      if (!currentUser || !window.currentGameTitle) return;
      try {
        const base64Data = await blobToBase64(saveBlob);
        const userDocRef = doc(db, "saves", currentUser.uid);
        
        await setDoc(userDocRef, {
          [window.currentGameTitle]: base64Data
        }, { merge: true });
        
        console.log("Cloud save synced to Firestore!");
      } catch (err) {
        console.error("Firestore save failed:", err);
      }
    };

    window.loadSaveFromCloud = async function() {
      if (!currentUser || !window.currentGameTitle) return null;
      try {
        const userDocRef = doc(db, "saves", currentUser.uid);
        const docSnap = await getDoc(userDocRef);
        
        if (docSnap.exists() && docSnap.data()[window.currentGameTitle]) {
          console.log("Cloud save loaded from Firestore!");
          const base64Data = docSnap.data()[window.currentGameTitle];
          return base64ToBlob(base64Data);
        }
        return null;
      } catch (err) {
        console.error("No Firestore save found or load failed:", err);
        return null;
      }
    };
  </script>

  <!-- GITHUB LIBRARY SCANNER -->
  <script>
    async function fetchArcadeLibrary() {
  const container = document.getElementById('games-container');

  try {
    // Fetches your local manifest file - 0 API limits!
    const response = await fetch('manifest.json');
    if (!response.ok) throw new Error("Could not find manifest.json");
    
    const library = await response.json();
    container.innerHTML = '';

    for (const [systemKey, games] of Object.entries(library)) {
      const systemData = SYSTEM_MAP[systemKey.toLowerCase()] || { 
        system: null,
        name: systemKey.toUpperCase(), 
        emoji: '🎮' 
      };

      if (games.length > 0) {
        const sectionHtml = `
          <div class="category-section">
            <h2 class="category-title">${systemData.name}</h2>
            <div class="games-grid" id="grid-${systemKey}"></div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', sectionHtml);

        const grid = document.getElementById(`grid-${systemKey}`);

        games.forEach(filename => {
          const gameTitle = filename.replace(/\.[^/.]+$/, "");
          const romPath = `roms/${systemKey}/${filename}`;
          
          const encodedTitle = encodeURIComponent(gameTitle);
          const boxartUrl = systemData.system 
            ? `https://cdn.jsdelivr.net/gh/libretro/libretro-thumbnails@master/${systemData.system}/Named_Boxarts/${encodedTitle}.png` 
            : '';

          const cardHtml = `
            <div class="game-card" onclick="launchGame('${systemKey}', '${romPath}', '${gameTitle}')">
              <div class="game-thumb">
                ${boxartUrl ? `<img src="${boxartUrl}" alt="${gameTitle}" style="width:100%; height:100%; object-fit:cover; border-radius:8px;" onerror="this.outerHTML='${systemData.emoji}'">` : systemData.emoji}
              </div>
              <h3>${gameTitle}</h3>
              <p>Click to play!</p>
            </div>
          `;
          grid.insertAdjacentHTML('beforeend', cardHtml);
        });
      }
    }
  } catch (err) {
    console.error("Error loading library:", err);
    container.innerHTML = `<div id="loading-games-msg">Create a manifest.json file to list your games!</div>`;
  }
}
  </script>

  <!-- FIXED EMULATORJS LAUNCHER -->
  <script>
    async function launchGame(core, romPath, title) {
      window.currentGameTitle = title;
      
      const modal = document.getElementById('player-modal');
      document.getElementById('modal-title').innerText = title;
      modal.classList.add('active');

      const container = document.getElementById('game');
      container.innerHTML = '';

      // Set global configuration variables
      window.EJS_player = '#game';
      window.EJS_core = core;
      window.EJS_gameUrl = romPath;
      
      // FIXED: Using jsDelivr CDN with proper trailing slash
      window.EJS_pathtodata = 'https://cdn.jsdelivr.net/npm/emulatorjs@latest/data/';

      if (window.loadSaveFromCloud) {
        const cloudSave = await window.loadSaveFromCloud();
        if (cloudSave) {
          window.EJS_loadStateURL = URL.createObjectURL(cloudSave);
        }
      }

      window.EJS_onSaveState = function(data) {
        if (window.syncSaveToCloud) {
          const blob = new Blob([data.state], { type: 'application/octet-stream' });
          window.syncSaveToCloud(blob);
        }
      };

      // FIXED: Load loader.js directly from jsDelivr CDN
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/emulatorjs@latest/data/loader.js';
      container.appendChild(script);
    }

    function closeGame() {
      document.getElementById('player-modal').classList.remove('active');
      document.getElementById('game').innerHTML = '';
    }
  </script>
</body>
</html>
