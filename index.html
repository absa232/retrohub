<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Arcade 💕</title>
  
  <!-- GOOGLE NOTO COLOR EMOJI FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0f0e17;
      --card-bg: #1f1e2e;
      --accent: #ff8ba7;
      --text: #fffffe;
      --subtext: #a7a9be;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Noto Color Emoji';
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
    }

    /* --- ROMANTIC LANDING OVERLAY --- */
    #landing-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #2a0845 0%, #6441a5 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s;
      text-align: center;
      padding: 20px;
    }

    #landing-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .heart-icon {
      font-size: 60px;
      margin-bottom: 20px;
      font-family: 'Noto Color Emoji', sans-serif;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .landing-title {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .landing-subtitle {
      font-size: 1.1rem;
      color: #e0e0e0;
      margin-bottom: 30px;
      max-width: 400px;
    }

    .enter-btn {
      background-color: var(--accent);
      color: #000;
      border: none;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 139, 167, 0.4);
      transition: transform 0.2s, background-color 0.2s;
    }

    .enter-btn:hover {
      transform: scale(1.05);
      background-color: #ff9fb5;
    }

    /* --- DASHBOARD STYLES --- */
    .dashboard {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      margin-bottom: 40px;
      border-bottom: 2px solid var(--card-bg);
      padding-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-info h1 {
      font-size: 2.2rem;
      color: var(--accent);
    }

    .header-info p {
      color: var(--subtext);
      margin-top: 5px;
    }

    /* Top-Right Profile Badge */
    .user-profile {
      display: none;
      align-items: center;
      gap: 12px;
      background-color: var(--card-bg);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .user-profile.active {
      display: flex;
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      object-fit: cover;
    }

    .user-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
    }

    /* Categories */
    .category-section {
      margin-bottom: 50px;
    }

    .category-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .category-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 20px;
      background-color: var(--accent);
      border-radius: 2px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .game-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .game-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      border-color: var(--accent);
    }

    .game-thumb {
      width: 100%;
      height: 140px;
      background-color: #121212;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.5rem;
      font-family: 'Noto Color Emoji', sans-serif;
      color: var(--subtext);
      object-fit: cover;
    }

    .game-card h3 {
      font-size: 1.1rem;
      margin-bottom: 5px;
    }

    .game-card p {
      font-size: 0.85rem;
      color: var(--subtext);
    }

    /* --- EMULATOR MODAL --- */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      background-color: rgba(0,0,0,0.75);
    }
    .modal.active { display: flex; }

    .modal-content {
      background: var(--card-bg);
      width: 90%;
      max-width: 900px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }

    .modal-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .modal-title { font-size: 1.1rem; color: var(--accent); font-weight: 700; }

    .close-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.4rem;
      cursor: pointer;
    }

    .emulator-body {
      width: 100%;
      height: 560px;
      background-color: #000;
      position: relative;
    }

    #game { width: 100%; height: 100%; }
    .crt-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(0,0,0,0.0), rgba(0,0,0,0.08)), repeating-linear-gradient(transparent, rgba(0,0,0,0.06) 1px, transparent 2px);
      mix-blend-mode: overlay;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <!-- ROMANTIC LANDING SCREEN -->
  <div id="landing-screen">
    <div class="heart-icon">🎮💖</div>
    <h1 class="landing-title">Welcome to Our Retro Hub</h1>
    <p class="landing-subtitle">I built this small space so we can play through some iconic classics together, no matter how many miles are between us.</p>
    <button class="enter-btn" onclick="loginAndEnter()">Sign in with Google 💖</button>
  </div>

  <!-- MAIN DASHBOARD -->
  <div class="dashboard">
    <header>
      <div class="header-info">
        <h1>Our Co-Op Corner</h1>
        <p id="user-greeting">Pick a game and let's play together!</p>
      </div>

      <!-- Profile Badge (Top Right) -->
      <div id="user-profile" class="user-profile">
        <img id="user-avatar" class="user-avatar" src="" alt="Profile Picture" />
        <span id="user-name" class="user-name"></span>
      </div>
    </header>

    <!-- DYNAMIC GAMES LIBRARY (populated from GitHub 'roms' folder) -->
    <div id="games-container"></div>
  </div>

  <!-- POPUP EMULATOR PLAYER -->
  <div id="player-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">Loading Game...</div>
        <button class="close-btn" onclick="closeGame()">✕</button>
      </div>
      <div class="emulator-body" id="emulator-container">
        <div id="game"></div>
        <div class="crt-overlay"></div>
      </div>
    </div>
  </div>

  <!-- FIREBASE SDKs (Cloud Firestore) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // YOUR EXPLICIT FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyAeS_FJxXZbbakYuOMhF1MI_1P1Ht8EUwA",
      authDomain: "our-arcade-c417d.firebaseapp.com",
      projectId: "our-arcade-c417d",
      storageBucket: "our-arcade-c417d.firebasestorage.app",
      messagingSenderId: "48063295144",
      appId: "1:48063295144:web:1bdcb75b600222d8ee5c9d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    provider.setCustomParameters({ prompt: 'select_account' });

    window.currentUser = null;
    window.currentGameTitle = "";

    function updateUserUI(user) {
      window.currentUser = user || null;
      document.getElementById('landing-screen').classList.add('hidden');
      document.getElementById('user-greeting').innerText = user
        ? `Welcome back! Pick a game and let's play together!`
        : `Pick a game and let's play together!`;

      if (user) {
        document.getElementById('user-name').innerText = user.displayName || 'Player';
        if (user.photoURL) {
          document.getElementById('user-avatar').src = user.photoURL;
        } else {
          document.getElementById('user-avatar').src = 'https://via.placeholder.com/40';
        }
        document.getElementById('user-profile').classList.add('active');
      } else {
        document.getElementById('user-name').innerText = 'Guest Player';
        document.getElementById('user-avatar').src = 'https://via.placeholder.com/40';
        document.getElementById('user-profile').classList.add('active');
      }
    }

    function enterArcadeWithoutLogin() {
      updateUserUI({
        displayName: 'Guest Player',
        photoURL: 'https://via.placeholder.com/40'
      });
    }

    window.loginAndEnter = async function() {
      const isLocalFile = location.protocol === 'file:';
      if (isLocalFile) {
        enterArcadeWithoutLogin();
        return;
      }

      try {
        const result = await signInWithPopup(auth, provider);
        updateUserUI(result.user);
      } catch (error) {
        console.error("Authentication failed:", error);
        enterArcadeWithoutLogin();
      }
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        updateUserUI(user);
      } else if (location.protocol !== 'file:') {
        // leave landing screen visible until user taps in, but never block the arcade forever
        document.getElementById('landing-screen').classList.remove('hidden');
      }
    });

    // Expose auth and provider for non-module scripts (profile dropdown handlers)
    window.auth = auth;
    window.provider = provider;

    // Initialize IndexedDB for instant local save caching
    const dbName = 'ArcadeSaves';
    const storeName = 'saves';
    let localDB = null;

    const initIndexedDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(dbName, 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          localDB = request.result;
          resolve(localDB);
        };
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(storeName)) {
            db.createObjectStore(storeName, { keyPath: 'id' });
          }
        };
      });
    };

    const saveToIndexedDB = async (gameTitle, saveBlob) => {
      if (!localDB) await initIndexedDB();
      return new Promise((resolve, reject) => {
        const tx = localDB.transaction(storeName, 'readwrite');
        const store = tx.objectStore(storeName);
        store.put({
          id: gameTitle,
          blob: saveBlob,
          timestamp: Date.now()
        });
        tx.onerror = () => reject(tx.error);
        tx.oncomplete = () => resolve(true);
      });
    };

    const loadFromIndexedDB = async (gameTitle) => {
      if (!localDB) await initIndexedDB();
      return new Promise((resolve, reject) => {
        const tx = localDB.transaction(storeName, 'readonly');
        const store = tx.objectStore(storeName);
        const request = store.get(gameTitle);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result?.blob || null);
      });
    };

    // Initialize IndexedDB on page load
    initIndexedDB().catch(err => console.warn('IndexedDB init failed:', err));

    const blobToBase64 = (blob) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(blob);
      });
    };

    const normalizeSavePayload = (input) => {
      if (input == null) return null;
      if (input instanceof Blob) return input;
      if (input instanceof ArrayBuffer) return new Blob([input], { type: 'application/octet-stream' });
      if (ArrayBuffer.isView(input)) return new Blob([input.buffer], { type: 'application/octet-stream' });
      if (typeof input === 'string') return new Blob([input], { type: 'text/plain' });
      if (typeof input === 'object') {
        if (input.state !== undefined) return normalizeSavePayload(input.state);
        if (input.blob !== undefined) return normalizeSavePayload(input.blob);
        if (input.data !== undefined) return normalizeSavePayload(input.data);
        if (input.file !== undefined) return normalizeSavePayload(input.file);
        return new Blob([JSON.stringify(input)], { type: 'application/json' });
      }
      return new Blob([String(input)], { type: 'text/plain' });
    };

    const base64ToBlob = (base64) => {
      const byteCharacters = atob(base64);
      const byteNumbers = new Array(byteCharacters.length);
      for (let i = 0; i < byteCharacters.length; i++) {
        byteNumbers[i] = byteCharacters.charCodeAt(i);
      }
      return new Blob([new Uint8Array(byteNumbers)], { type: 'application/octet-stream' });
    };

    window.syncSaveToCloud = async function(saveInput) {
      console.log('SYNC_SAVE_START', { currentUser: !!window.currentUser, currentGameTitle: window.currentGameTitle, uid: window.currentUser?.uid });
      
      if (!window.currentUser) {
        console.error('SYNC_FAILED: currentUser is null or undefined');
        return;
      }
      if (!window.currentGameTitle) {
        console.error('SYNC_FAILED: currentGameTitle is null or undefined');
        return;
      }
      
      try {
        console.log('NORMALIZING_PAYLOAD', typeof saveInput, saveInput instanceof Uint8Array ? 'Uint8Array' : typeof saveInput);
        const saveBlob = normalizeSavePayload(saveInput);
        console.log('PAYLOAD_NORMALIZED', !!saveBlob, saveBlob?.type, saveBlob?.size);
        
        if (!saveBlob) {
          console.warn('No valid save payload to sync.');
          return;
        }
        
        // INSTANT: Save to IndexedDB immediately
        console.log('SAVING_TO_INDEXEDDB');
        await saveToIndexedDB(window.currentGameTitle, saveBlob);
        console.log('LOCAL_SAVE_COMPLETE - Data is safe locally!');
        
        // BACKGROUND: Sync to Firestore async (don't wait for user)
        syncToFirestoreAsync(window.currentGameTitle, saveBlob).catch(err => {
          console.error('Background Firestore sync failed:', err);
        });
        
      } catch (err) {
        console.error("Local save failed:", err);
      }
    };

    // Background Firestore sync (don't block user)
    const syncToFirestoreAsync = async (gameTitle, saveBlob) => {
      try {
        console.log('FIRESTORE_SYNC_STARTING_BACKGROUND');
        const base64Data = await blobToBase64(saveBlob);
        
        // Split into 800KB chunks
        const CHUNK_SIZE = 800000;
        const chunks = [];
        for (let i = 0; i < base64Data.length; i += CHUNK_SIZE) {
          chunks.push(base64Data.substring(i, i + CHUNK_SIZE));
        }
        
        console.log('DATA_CHUNKED', { totalChunks: chunks.length });
        
        // Batch write
        const batch = writeBatch(db);
        const timestamp = Date.now();
        
        const metadataRef = doc(db, 'saves', window.currentUser.uid, 'games', gameTitle);
        batch.set(metadataRef, {
          timestamp: timestamp,
          chunkCount: chunks.length,
          totalSize: base64Data.length,
          lastUpdated: new Date().toISOString()
        }, { merge: true });
        
        for (let i = 0; i < chunks.length; i++) {
          const chunkRef = doc(db, 'saves', window.currentUser.uid, 'games', `${gameTitle}_chunk_${i}`);
          batch.set(chunkRef, {
            data: chunks[i],
            index: i,
            gameTitle: gameTitle,
            timestamp: timestamp
          });
        }
        
        await batch.commit();
        console.log('FIRESTORE_SYNC_COMPLETE');
      } catch (err) {
        console.error("Firestore background sync failed:", err.message);
      }
    };

    window.loadSaveFromCloud = async function() {
      if (!window.currentUser || !window.currentGameTitle) return null;
      
      try {
        // Try IndexedDB first (instant load if available)
        console.log('Checking IndexedDB for save...');
        const localSave = await loadFromIndexedDB(window.currentGameTitle);
        if (localSave) {
          console.log('Save loaded from IndexedDB (instant)!');
          return localSave;
        }
        
        // Fallback to Firestore
        console.log('No local save, loading from Firestore...');
        const metadataRef = doc(db, 'saves', window.currentUser.uid, 'games', window.currentGameTitle);
        const metadataSnap = await getDoc(metadataRef);
        
        if (!metadataSnap.exists()) {
          console.log('No save found for', window.currentGameTitle);
          return null;
        }
        
        const metadata = metadataSnap.data();
        const chunkCount = metadata.chunkCount || 1;
        console.log('Loading save from Firestore with', chunkCount, 'chunks');
        
        // Load all chunks
        let base64Data = '';
        for (let i = 0; i < chunkCount; i++) {
          const chunkRef = doc(db, 'saves', window.currentUser.uid, 'games', `${window.currentGameTitle}_chunk_${i}`);
          const chunkSnap = await getDoc(chunkRef);
          if (chunkSnap.exists()) {
            base64Data += chunkSnap.data().data;
          }
        }
        
        if (!base64Data) return null;
        
        // Cache it locally for next time
        const blob = base64ToBlob(base64Data);
        saveToIndexedDB(window.currentGameTitle, blob).catch(err => {
          console.warn('Failed to cache save locally:', err);
        });
        
        console.log('Cloud save loaded from Firestore!');
        return blob;
      } catch (err) {
        console.error("Cloud save load failed:", err);
        return null;
      }
    };
  </script>

  <script>
    // GitHub arcade scanner + unified emulator launcher + account helpers
    const GITHUB_USERNAME = 'absa232';
    const GITHUB_REPO = 'retrohub';

    const SYSTEM_MAP = {
      'megadrive': { system: 'Sega_-_Mega_Drive_-_Genesis', core: 'segaMD', name: 'SEGA MEGADRIVE', emoji: '🌀' },
      'snes': { system: 'Nintendo_-_Super_Nintendo_Entertainment_System', core: 'snes', name: 'SUPER NINTENDO', emoji: '🎮' },
      'gba': { system: 'Nintendo_-_Game_Boy_Advance', core: 'gba', name: 'GAME BOY ADVANCE', emoji: '🕹️' },
      'n64': { system: 'Nintendo_-_Nintendo_64', core: 'n64', name: 'NINTENDO 64', emoji: '🏰' }
    };

    // Create a small dropdown for account actions inside the existing profile badge
    (function createProfileDropdown(){
      const profile = document.getElementById('user-profile');
      if (!profile) return;
      const menu = document.createElement('div');
      menu.id = 'profile-dropdown';
      menu.style.position = 'absolute';
      menu.style.right = '20px';
      menu.style.top = '70px';
      menu.style.background = 'var(--card-bg)';
      menu.style.border = '1px solid rgba(255,255,255,0.06)';
      menu.style.borderRadius = '8px';
      menu.style.display = 'none';
      menu.style.zIndex = 10001;
      menu.innerHTML = `
        <div style="padding:8px 12px; cursor:pointer; color:var(--text); font-size:0.95rem;" id="change-account">🔄 Change Account</div>
        <div style="padding:8px 12px; cursor:pointer; color:var(--accent); font-size:0.95rem;" id="log-out">🚪 Log Out</div>
      `;
      document.body.appendChild(menu);

      profile.style.position = 'relative';
      profile.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.style.display = (menu.style.display === 'none') ? 'block' : 'none';
      });
      document.addEventListener('click', () => menu.style.display = 'none');

      document.getElementById('change-account').addEventListener('click', () => {
        menu.style.display = 'none';
        changeAccount();
      });
      document.getElementById('log-out').addEventListener('click', () => {
        menu.style.display = 'none';
        logout();
      });
    })();

    // Change account (uses modular Firebase auth already initialized in-page)
    async function changeAccount() {
      if (window.loginAndEnter) {
        try { await window.loginAndEnter(); } catch (e) { console.error('Change account failed', e); }
      } else {
        alert('Authentication is not ready yet. Please try again.');
      }
    }

    async function logout() {
      try {
        if (window.auth && typeof window.auth.signOut === 'function') {
          await window.auth.signOut();
          location.reload();
        } else {
          alert('Logout is not available.');
        }
      } catch (err) {
        console.error('Logout failed', err);
      }
    }

    // GitHub scanner to populate #games-container
    async function fetchArcadeLibrary() {
      const container = document.getElementById('games-container');
      if (!container) return;

      const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/roms`;
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) {
          if (response.status === 403) throw new Error('GitHub API rate limit reached. Please wait a few minutes and refresh.');
          throw new Error(`Could not access 'roms' directory (${response.status}).`);
        }

        const folders = await response.json();
        container.innerHTML = '';
        let totalGamesFound = 0;

        for (const folder of folders) {
          if (folder.type === 'dir') {
            const systemKey = folder.name.toLowerCase();
            const systemData = SYSTEM_MAP[systemKey] || { system: null, core: systemKey, name: folder.name.toUpperCase(), emoji: '🎮' };

            const subfolderUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/roms/${folder.name}`;
            const gamesResponse = await fetch(subfolderUrl);
            if (!gamesResponse.ok) continue;

            const files = await gamesResponse.json();

            const romFiles = files.filter(f => f.type === 'file' && (
              f.name.endsWith('.zip') || f.name.endsWith('.gen') || f.name.endsWith('.smd') || f.name.endsWith('.bin') || f.name.endsWith('.snes') || f.name.endsWith('.gba') || f.name.endsWith('.z64') || f.name.endsWith('.n64')
            ));

            if (romFiles.length > 0) {
              totalGamesFound += romFiles.length;

              const section = document.createElement('div');
              section.className = 'category-section';
              section.innerHTML = `
                <h2 class="category-title">${systemData.name}</h2>
                <div class="games-grid" id="grid-${systemKey}"></div>
              `;
              container.appendChild(section);

              const grid = section.querySelector(`#grid-${systemKey}`);

              romFiles.forEach(file => {
                const gameTitle = file.name.replace(/\.[^/.]+$/, "");
                const romPath = `roms/${folder.name}/${file.name}`;
                const rawRomUrl = file.download_url || `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/${romPath}`;
                const safeTitle = gameTitle.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safeRomUrl = rawRomUrl.replace(/'/g, "\\'");
                const encodedTitle = encodeURIComponent(gameTitle);
                const boxartUrl = systemData.system ? `https://cdn.jsdelivr.net/gh/libretro/libretro-thumbnails@master/${systemData.system}/Named_Boxarts/${encodedTitle}.png` : '';

                const launchCore = systemData.core || systemKey;
                const card = document.createElement('div');
                card.className = 'game-card';
                card.setAttribute('onclick', `launchGame('${launchCore}', '${safeRomUrl}', '${safeTitle}')`);
                card.innerHTML = `
                  <div class="game-thumb">${boxartUrl ? `<img src="${boxartUrl}" alt="${safeTitle}" style="width:100%; height:100%; object-fit:cover; border-radius:8px;" onerror="this.outerHTML='${systemData.emoji}'">` : systemData.emoji}</div>
                  <h3>${gameTitle}</h3>
                  <p>Click to play!</p>
                `;
                grid.appendChild(card);
              });
            }
          }
        }

        if (totalGamesFound === 0) {
          container.innerHTML = `<div id="loading-games-msg">No supported ROM files found inside your 'roms' folder.</div>`;
        }

      } catch (err) {
        console.error('Error scanning library:', err);
        container.innerHTML = `<div id="loading-games-msg">⚠️ ${err.message}</div>`;
      }
    }

    // Unified emulator launcher: set EJS_* globals then append loader.js
    async function launchGame(core, romPath, title) {
      const mappedCore = SYSTEM_MAP[core]?.core || core;

      window.currentGameTitle = title;
      console.log('LAUNCH_GAME', { title, mappedCore, uid: window.currentUser?.uid });
      document.getElementById('modal-title').innerText = title;
      document.getElementById('player-modal').classList.add('active');

      const gameRoot = document.getElementById('game');
      if (gameRoot) {
        gameRoot.innerHTML = '';
      }

      const normalizedRomUrl = /^https?:\/\//i.test(romPath)
        ? romPath
        : `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/${romPath}`;

      window.EJS_player = '#game';
      window.EJS_core = mappedCore;
      window.EJS_gameUrl = normalizedRomUrl;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

      if (window.loadSaveFromCloud) {
        const cloudSave = await window.loadSaveFromCloud();
        if (cloudSave) {
          window.EJS_loadStateURL = URL.createObjectURL(cloudSave);
        }
      }

      function arcadeSaveHandler(data) {
        console.log('SAVE CALLBACK FIRED', data);
        console.log('SAVE CALLBACK KEYS', data && typeof data === 'object' ? Object.keys(data) : 'not-object');
        if (window.syncSaveToCloud) {
          const savePayload = data && typeof data === 'object' && data.state !== undefined ? data.state : data;
          window.syncSaveToCloud(savePayload);
        }
      }

      const bindSaveHandler = () => {
        if (!window.EJS_emulator || typeof window.EJS_emulator.on !== 'function') {
          setTimeout(bindSaveHandler, 250);
          return;
        }

        console.log('ATTACHING EMULATOR SAVE HANDLER');
        window.EJS_emulator.off?.('saveState', window.__arcadeSaveHook);
        window.__arcadeSaveHook = function(data) {
          arcadeSaveHandler(data);
        };
        window.EJS_emulator.on('saveState', window.__arcadeSaveHook);
      };

      window.EJS_onSaveState = arcadeSaveHandler;
      if (window.EJS_emulator) {
        try { window.EJS_emulator.destroy(); } catch (e) { console.warn(e); }
      }
      bindSaveHandler();

      // The emulator's built-in autosave (EJS_autosave = 1) will trigger saveState callbacks
      console.log('Emulator auto-save configured: every 60 seconds');
      console.log('When auto-save triggers, it will call the save handler -> IndexedDB + Firestore');
      

      const existingLoader = document.querySelector('script[src="https://cdn.emulatorjs.org/stable/data/loader.js"]');
      if (existingLoader) {
        existingLoader.remove();
      }

      const ejsScript = document.createElement('script');
      ejsScript.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      ejsScript.async = false;
      document.body.appendChild(ejsScript);
      
      // Set up auto-save - will start attempting to save after 2 seconds
      setTimeout(() => {
        console.log('AUTO_SAVE_SETUP: Starting auto-save interval (60 seconds)');
        window.currentAutoSaveInterval = setInterval(() => {
          if (window.currentUser && window.currentGameTitle) {
            try {
              // Find and click the Save State button (uses .ejs_menu_button class)
              const saveBtn = Array.from(document.querySelectorAll('.ejs_menu_button')).find(b => b.innerText === 'Save State');
              if (saveBtn) {
                console.log('AUTO_SAVE_TICK: Saving game state for', window.currentGameTitle);
                saveBtn.click();
              } else {
                console.warn('AUTO_SAVE: Save State button not found');
              }
            } catch (e) {
              console.warn('AUTO_SAVE_ERROR:', e.message);
            }
          }
        }, 60000); // 60 seconds (1 minute) as per requirement
      }, 2000);
    }

    function closeGame() {
      // Stop auto-save when exiting
      if (window.currentAutoSaveInterval) {
        clearInterval(window.currentAutoSaveInterval);
        window.currentAutoSaveInterval = null;
        console.log('AUTO_SAVE_DISABLED');
      }
      
      document.getElementById('player-modal').classList.remove('active');
      if (window.EJS_emulator) {
        try { window.EJS_emulator.destroy(); } catch (e) { console.warn(e); }
      }
      const gameNode = document.getElementById('game');
      if (gameNode) gameNode.innerHTML = '';
    }

    window.addEventListener('DOMContentLoaded', fetchArcadeLibrary);
  </script>
</body>
</html>
