<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to Our Retro Hub</title>
  
  <!-- GOOGLE NOTO COLOR EMOJI FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0f0e17;
      --card-bg: #1f1e2e;
      --accent: #ff8ba7;
      --text: #fffffe;
      --subtext: #a7a9be;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Noto Color Emoji';
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
    }

    /* --- ROMANTIC LANDING OVERLAY --- */
    #landing-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #2a0845 0%, #6441a5 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s;
      text-align: center;
      padding: 20px;
    }

    #landing-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .heart-icon {
      font-size: 60px;
      margin-bottom: 20px;
      font-family: 'Noto Color Emoji', sans-serif;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .landing-title {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .landing-subtitle {
      font-size: 1.1rem;
      color: #e0e0e0;
      margin-bottom: 30px;
      max-width: 400px;
    }

    /* Loading spinner animation */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .welcome-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(0, 0, 0, 0.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .google-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .google-icon svg {
      width: 100%;
      height: 100%;
    }

    .google-icon.hidden,
    #welcome-btn-label.hidden {
      display: none;
    }

    .welcome-spinner.hidden {
      display: none;
    }

    .enter-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .enter-btn {
      background-color: var(--accent);
      color: #000;
      border: none;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 139, 167, 0.4);
      transition: transform 0.2s, background-color 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      max-width: 100%;
      white-space: nowrap;
    }

    .enter-btn:hover {
      transform: scale(1.05);
      background-color: #ff9fb5;
    }

    /* Make Google icon more visible */
    .google-icon svg path {
      filter: drop-shadow(0 0 2px rgba(0,0,0,0.5));
    }

    .google-icon {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .google-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <!-- ROMANTIC LANDING SCREEN -->
  <div id="landing-screen">
    <div class="heart-icon">🎮💖</div>
    <h1 class="landing-title">Welcome to Our Retro Hub</h1>
    <p class="landing-subtitle">I built this small space so we can play through some iconic classics together, no matter how many miles are between us.</p>
    <button id="welcome-btn" class="enter-btn" onclick="loginAndEnter()">
      <span id="welcome-spinner" class="welcome-spinner"></span>
      <span id="welcome-google-icon" class="google-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Google">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.72 1.23 9.24 3.64l6.81-6.81C35.91 2.36 30.52 0 24 0 14.64 0 6.5 5.37 2.56 13.22l7.91 6.13C12.12 13.13 17.44 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.64-.15-3.22-.43-4.74H24v9h12.7c-.55 2.98-2.24 5.5-4.77 7.19l7.72 5.98C43.9 36.74 46.5 31.22 46.5 24.5z"/>
          <path fill="#FBBC05" d="M32.93 36.95c-2.1 1.4-4.8 2.22-8.93 2.22-6.56 0-12.12-4.43-14.1-10.36l-8.03 6.2C5.5 42.53 13.82 48 24 48c7.1 0 13.08-2.34 17.43-6.35l-8.5-4.7z"/>
          <path fill="#34A853" d="M10.9 29.81A14.97 14.97 0 0 1 9.5 24c0-1.7.29-3.33.81-4.81l-8.03-6.2A23.95 23.95 0 0 0 0 24c0 3.83.92 7.45 2.56 10.66l8.34-6.85z"/>
        </svg>
      </span>
      <span id="welcome-btn-label">Sign in with Google</span>
    </button>
  </div>

  <!-- FIREBASE SDKs (Cloud Firestore) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // YOUR EXPLICIT FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyAeS_FJxXZbbakYuOMhF1MI_1P1Ht8EUwA",
      authDomain: "our-arcade-c417d.firebaseapp.com",
      projectId: "our-arcade-c417d",
      storageBucket: "our-arcade-c417d.appspot.com",
      messagingSenderId: "48063295144",
      appId: "1:48063295144:web:1bdcb75b600222d8ee5c9d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    provider.setCustomParameters({ prompt: 'select_account' });

    function showWelcomeLoadingState() {
      const btn = document.getElementById('welcome-btn');
      const spinner = document.getElementById('welcome-spinner');
      const icon = document.getElementById('welcome-google-icon');
      const label = document.getElementById('welcome-btn-label');
      
      if (spinner) spinner.classList.remove('hidden');
      if (icon) icon.classList.add('hidden');
      if (label) {
        label.classList.remove('hidden');
        label.innerText = 'Verifying...';
      }
      if (btn) btn.disabled = true;
    }

    function updateWelcomeButton(user) {
      const btn = document.getElementById('welcome-btn');
      const spinner = document.getElementById('welcome-spinner');
      const icon = document.getElementById('welcome-google-icon');
      const label = document.getElementById('welcome-btn-label');
      
      if (spinner) spinner.classList.add('hidden');
      if (icon) icon.classList.remove('hidden');
      if (label) label.classList.remove('hidden');
      
      if (label) {
        label.innerText = user ? `Continue as ${user.displayName || 'Google User'}` : 'Sign in with Google';
      }
      
      if (btn) btn.disabled = false;
    }

    window.loginAndEnter = async function() {
      const isLocalFile = location.protocol === 'file:';

      // Already logged in: redirect to index.html
      if (auth.currentUser) {
        window.location.href = 'index.html';
        return;
      }

      if (isLocalFile) {
        // Local file: go to index.html in guest mode
        window.location.href = 'index.html';
        return;
      }

      showWelcomeLoadingState();

      try {
        const result = await signInWithPopup(auth, provider);
        // After successful login, redirect to index.html
        window.location.href = 'index.html';
      } catch (error) {
        if (error.code === 'auth/popup-closed-by-user' || error.code === 'auth/popup-blocked') {
          console.log('User cancelled login');
          updateWelcomeButton(auth.currentUser);
          return;
        }

        if (error && (error.code === 'auth/unauthorized-domain' || error.code === 'auth/invalid-domain')) {
          console.warn('Firebase domain is not authorized for this deployment.');
          window.location.href = 'index.html';
          return;
        }
        
        console.error("Authentication failed:", error);
        updateWelcomeButton(null);
      }
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        console.log('User logged in, redirecting to dashboard.html');
        window.location.href = 'dashboard.html';
      } else if (location.protocol !== 'file:') {
        updateWelcomeButton(null);
        console.log('No user logged in, staying on welcome page');
      }
    });

    // Expose auth for welcome page
    window.auth = auth;
    window.provider = provider;
  </script>
</body>
</html>
